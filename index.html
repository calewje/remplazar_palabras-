<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <div class="container mt-4">
        <div class="row mb-3 justify-content-center">
            <div class="card justify-content-center" style="width: 25rem; background-color: rgba(255, 255, 255, 0.5);">
                <img class="mx-auto d-block" src="./public/img/Itadori.png" height="95" width="125px">
                <div class="card-body row justify-content-center">

                    <h1 class="fw-bold text-center">Registro de Usuario</h1>

                    <label class="fw-bold" for="nombre">Nombre</label>
                    <input name="nombre" id="nombre" class="form-control mb-3" type="text" placeholder="Nombre">

                    <label class="fw-bold" for="semestre">Semestre</label>
                    <input name="semestre" id="semestre" class="form-control mb-3" type="text" placeholder="Semestre">

                    <label class="fw-bold" for="carrera">Carrera</label>
                    <input name="carrera" id="carrera" class="form-control mb-3" type="text" placeholder="Carrera">

                    <label class="fw-bold" for="horas">Horas</label>
                    <input name="horas" id="horas" class="form-control mb-3" type="text" placeholder="horas">

                    <div class="col justify-content-center text-center">
                        <button id="btn_registro" class="btn btn-success mb-2"><i
                                class="fa-solid fa-chalkboard-user"></i> Registrar</button>
                        <br>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./dist/bundle.js"></script>
</body>

</html>
